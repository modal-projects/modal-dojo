[project]
name = "modal-dojo"
version = "0.1.1"
description = "Get started with LLM training on Modal."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Modal Labs"}]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "modal==1.6.1",
    "synchronicity>=0.12.5,<1",
    "click~=8.5.0",
    "cloudpickle~=3.1.2",
    "datasets~=5.1.0",
    "httpx~=0.28.1",
    "packaging~=26.3",
    "pydantic~=2.14.1",
    "fastapi~=0.162.0",
    "randomname~=0.2.1",
    "rich~=15.0.0",
    "requests~=2.34.2",
    # Qwen3.5 tokenizers need 5.3+; the optional tinker-cookbook extra supplies its own cap.
    "transformers>=5.3.0",
]

[project.optional-dependencies]
# tinker-cookbook client for an existing Spindle server.
spindle = [
    "tinker==0.34.0",
    "tml-renderers==0.2.0",
    "tinker-cookbook>=0.5.8.dev15,<0.6",
]
# Adds deploying a Spindle server per run, the fallback to an existing server.
spindle-deploy = [
    "modal-dojo[spindle]",
    "modal-spindle==0.1.4; python_version == '3.12'",
]

# Use `uv sync --extra spindle` (or spindle-deploy) from a checkout for the pinned experimental integration.
[tool.uv.sources]
modal-spindle = { git = "https://github.com/modal-projects/spindle.git", rev = "9fd677db7b2a76a0f74434e00a62bcf6ed409ec4" }
tinker-cookbook = { git = "https://github.com/thinking-machines-lab/tinker-cookbook.git", rev = "ad3b5c541cd383b05d1c301e8ccc2d9cc0c5f774" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["modal_dojo", "dashboards/frontend"]
exclude = ["dashboards/frontend/node_modules", "dashboards/frontend/dist"]

[tool.hatch.build.targets.wheel.sources]
"dashboards/frontend" = "modal_dojo/_frontend"

[tool.hatch.build.targets.wheel.force-include]
"skills" = "modal_dojo/_skills"

[tool.hatch.build.targets.sdist.force-include]
"skills" = "skills"

[project.scripts]
modal-dojo = "modal_dojo.cli:main"

[project.urls]
Homepage = "https://github.com/modal-projects/modal-dojo"
Documentation = "https://dojo.modal.dev"

[dependency-groups]
ci = [
    "pygithub~=2.10.0",
]
dev = [
    "pre-commit~=4.7.0",
    "pytest~=9.1.1",
    "ruff~=0.17.2",
    "ipykernel~=7.4.0",
    "uv~=0.13.5",
    "pyyaml~=6.0.3",
]
docs = [
    "mkdocs-gen-files~=0.6.1",
    "mkdocs-material~=9.7.7",
    "properdocs~=1.6.7",
    "pymdown-extensions~=12.3",
]

[tool.ruff]
# "*.md": ruff 0.16 started formatting Markdown (fenced code blocks), which
# 0.15 did not — exclude it so the formatter only touches the files it always
# has, independent of the installed ruff version.
extend-exclude = ["tutorials/**", "*.md"]

# Pin the rule selection explicitly so linting is deterministic across ruff
# releases. ruff 0.16 expanded the *default* rule set for projects without an
# explicit select, which turned CI red overnight. This mirrors ruff's historical
# default select (E4/E7/E9 + F) so linting matches what we've been enforcing,
# independent of the installed ruff version.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
