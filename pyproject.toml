[project]
name = "modal-dojo"
version = "0.1.0"
description = "Get started with LLM training on Modal."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Modal Labs"}]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "modal==1.6.1",
    "synchronicity>=0.12.5,<1",
    "click>=8.2,<9",
    "cloudpickle",
    "datasets",
    "httpx",
    "pydantic",
    "fastapi",
    "randomname",
    "rich",
    # Qwen3.5 tokenizers need 5.3+; the optional cookbook supplies its own cap.
    "transformers>=5.3.0",
]

[project.optional-dependencies]
spindle = [
    "tinker==0.34.0",
    "tml-renderers==0.2.0",
    "modal-spindle==0.1.0; python_version == '3.12'",
    "tinker-cookbook>=0.5.8.dev15,<0.6",
]

# Spindle is not yet on PyPI. Keep VCS pins out of published Requires-Dist;
# use `uv sync --extra spindle` from a checkout for this experimental integration.
[tool.uv.sources]
modal-spindle = { git = "https://github.com/modal-projects/spindle.git", rev = "a36673f377a4bd79d1a48df326321414963dd40d" }
tinker-cookbook = { git = "https://github.com/thinking-machines-lab/tinker-cookbook.git", rev = "ad3b5c541cd383b05d1c301e8ccc2d9cc0c5f774" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["modal_dojo", "dashboards/frontend"]
exclude = ["dashboards/frontend/node_modules", "dashboards/frontend/dist"]

[tool.hatch.build.targets.wheel.sources]
"dashboards/frontend" = "modal_dojo/_frontend"

[tool.hatch.build.targets.wheel.force-include]
"skills" = "modal_dojo/_skills"

[tool.hatch.build.targets.sdist.force-include]
"skills" = "skills"

[project.scripts]
modal-dojo = "modal_dojo.cli:main"

[project.urls]
Homepage = "https://github.com/modal-projects/modal-dojo"
Documentation = "https://dojo.modal.dev"

[dependency-groups]
ci = [
    "pygithub>=2.9.1",
]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "ruff>=0.15.17",
    "ipykernel>=6.29.0",
    "uv>=0.11.0",
    "pyyaml>=6.0.3",
]
docs = [
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-material>=9.7.6",
    "properdocs>=1.6.7",
    "pymdown-extensions>=10.21.2",
]

[tool.ruff]
# "*.md": ruff 0.16 started formatting Markdown (fenced code blocks), which
# 0.15 did not — exclude it so the formatter only touches the files it always
# has, independent of the installed ruff version.
extend-exclude = ["tutorials/**", "*.md"]

# Pin the rule selection explicitly so linting is deterministic across ruff
# releases. ruff 0.16 expanded the *default* rule set for projects without an
# explicit select, which turned CI red overnight. This mirrors ruff's historical
# default select (E4/E7/E9 + F) so linting matches what we've been enforcing,
# independent of the installed ruff version.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
