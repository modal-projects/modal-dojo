name: Publish Miles image

on:
  workflow_dispatch:
    inputs:
      miles_ref:
        description: "radixark/miles branch, tag, or commit to build"
        required: true
        default: main
        type: string
      tag:
        description: "Docker Hub tag for modalresearch/miles (e.g. dev-20261109)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-miles-image-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Validate publish settings
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker image tag."
            exit 1
          fi
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN Actions secrets."
            exit 1
          fi

      # CUDA images need substantially more disk than the default free space.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          docker system prune --all --force
          df -h /

      - name: Check out Miles
        uses: actions/checkout@v4
        with:
          repository: radixark/miles
          ref: ${{ inputs.miles_ref }}
          persist-credentials: false

      - name: Resolve Miles commit
        id: miles
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: modalresearch/miles:${{ inputs.tag }}
          build-args: |
            MILES_COMMIT=${{ steps.miles.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/radixark/miles
            org.opencontainers.image.revision=${{ steps.miles.outputs.sha }}

      - name: Summarize published image
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          MILES_SHA: ${{ steps.miles.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Published Miles image'
            echo "- Image: \`modalresearch/miles:${IMAGE_TAG}\`"
            echo "- Digest: \`modalresearch/miles@${IMAGE_DIGEST}\`"
            echo "- Miles commit: \`${MILES_SHA}\`"
            echo '- Platform: `linux/amd64`'
          } >> "$GITHUB_STEP_SUMMARY"
