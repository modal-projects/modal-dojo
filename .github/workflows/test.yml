name: Tests


on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_call:


jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Verify generated files
        shell: bash
        run: |
          uv run python -m scripts.generate_llms_txt
          git diff --exit-code -- docs-next/public/llms.txt
          uv run scripts/generate_models_table.py --check
          uv run scripts/generate_quickstart.py --check
          uv run scripts/generate_api_reference.py --check

      - name: Compile tutorials
        run: uv run -m compileall tutorials/ scripts/quickstart.py

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Verify package builds
        run: uv build

      - name: Smoke-test installed wheel
        shell: python
        run: |
          import pathlib
          import subprocess
          import tempfile

          wheel = next(pathlib.Path("dist").glob("*.whl")).resolve()
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run(
                  ["uvx", "--from", str(wheel), "modal-dojo", "--help"],
                  cwd=directory,
                  check=True,
              )
