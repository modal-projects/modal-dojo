name: Validate Miles patch snapshots

on:
  pull_request:
    paths:
      - ".github/workflows/validate-miles-patch-snapshots.yml"
      - "modal_dojo/frameworks/miles/launcher.py"
      - "modal_dojo/train_recipes/miles_recipe/recipe.py"
      - "scripts/fetch_miles_patch_snapshots.py"
      - "tests/testdata/miles/*.input"

jobs:
  validate-snapshot:
    runs-on: ubuntu-latest
    environment: modal
    permissions:
      contents: read
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: training-gym
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install dependencies
        run: uv sync --group dev

      - name: Fetch source from pinned Miles image
        run: uv run modal run scripts/fetch_miles_patch_snapshots.py

      - name: Verify committed snapshot is current
        run: |
          git add -A -- tests/testdata/miles
          git diff --cached --exit-code -- tests/testdata/miles
