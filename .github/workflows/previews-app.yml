name: Previews App

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/previews-app.yml"
      - "scripts/previews/frontend_previews.py"
      - "scripts/previews/nginx/**"
      - "docs-next/astro_redirects.py"

permissions:
  contents: read

concurrency:
  group: previews-app
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: modal-deploy
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: dojo
      # dojo defaults to an image builder version modal 1.6.1 can't use.
      MODAL_IMAGE_BUILDER_VERSION: "2025.06"
    steps:
      - uses: actions/checkout@v4.4.0

      - uses: actions/setup-python@v5.6.0
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v5.4.2

      - name: Deploy previews app to Modal
        run: uv run --no-project --with modal modal deploy scripts/previews/frontend_previews.py
