name: Deploy model-validation synmon

on:
  push:
    branches:
      - main
    paths:
      - "modal_dojo/**"
      - "synthetic_monitoring/**"
      - "scripts/**"
  schedule:
    - cron: "0 18 * * *"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy model-validation synmon on Modal
    runs-on: ubuntu-latest
    environment: modal-deploy
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: training-gym
      UV_CACHE_DIR: /tmp/uv-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Sync dependencies
        run: uv sync

      - name: Deploy Modal Dojo model synmon on Modal
        run: >
          uv run modal deploy
          -m synthetic_monitoring.model_validation::app
