name: Validate Models

# One workflow for every framework. Which framework a model trains on lives in
# the registry (modal_dojo/common/models/validation.py), not here.
#
# Pull requests validate the models the diff touches. workflow_dispatch can
# name any registered model, including when validating a Miles image bump.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated model names to validate (blank = every registered model)"
        required: false
        default: ""
      num_steps:
        description: "Number of training steps (rollouts) per model"
        required: false
        default: "1"

permissions:
  contents: read

concurrency:
  # PR runs share a per-ref group so a new push supersedes the old run. A dispatch
  # may be a 16 x 8 H200 job, so it gets a group of its own (run_id is unique per
  # run): manual validations never abort — nor queue behind — one another.
  group: validate-models-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  list-models:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.list.outputs.models }}
    env:
      UV_CACHE_DIR: /tmp/uv-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --group ci --group dev

      - name: Determine models to validate
        id: list
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODELS_INPUT: ${{ github.event.inputs.models }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            models=$(git diff "$BASE_SHA...HEAD" \
              | uv run python -m scripts.diff_impact --models)
          elif [ -n "$MODELS_INPUT" ]; then
            models=$(printf '%s' "$MODELS_INPUT" \
              | uv run python -c "import json,sys; print(json.dumps([m.strip() for m in sys.stdin.read().split(',') if m.strip()]))")
          else
            models=$(uv run scripts/validate_model_configs.py list --names-only)
          fi
          echo "Selected models: $models"
          echo "models=$models" >> "$GITHUB_OUTPUT"

  validate:
    needs: list-models
    if: needs.list-models.outputs.models != '[]'
    runs-on: ubuntu-latest
    environment: modal
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.list-models.outputs.models) }}
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: training-gym
      UV_CACHE_DIR: /tmp/uv-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --group ci --group dev

      - name: Compute artifact name
        id: artifact
        env:
          MODEL: ${{ matrix.model }}
        run: echo "name=validate-result-$(printf '%s' "$MODEL" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      # Every interpolated value reaches the shell as an environment variable:
      # the matrix model can come from the workflow_dispatch input, so expanding
      # it into the script would let a crafted value run commands in a job that
      # holds Modal credentials.
      - name: Validate ${{ matrix.model }}
        env:
          MODEL: ${{ matrix.model }}
          NUM_STEPS: ${{ github.event.inputs.num_steps || '1' }}
          RESULT_NAME: ${{ steps.artifact.outputs.name }}
        run: |
          uv run scripts/validate_model_configs.py check \
            --model "$MODEL" \
            --num_steps "$NUM_STEPS" \
            --output "$RESULT_NAME.json"

      - name: Upload result
        if: always() && hashFiles(format('{0}.json', steps.artifact.outputs.name)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.name }}.json

  comment:
    needs: validate
    if: >-
      always() && github.event_name == 'pull_request' &&
      (needs.validate.result == 'success' || needs.validate.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      UV_CACHE_DIR: /tmp/uv-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --group ci --group dev

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          path: results
          pattern: validate-result-*
          merge-multiple: true

      - name: Download baselines from main
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run python scripts/download_perf_baseline.py
          --baseline-dir baseline --results-dir results

      - name: Build comment body
        run: >-
          uv run scripts/validate_model_configs.py summarize
          --results-dir results --baseline-dir baseline
          --dashboard-url "${{ vars.VALIDATION_DASHBOARD_URL }}"
          > comment.md

      - name: Post comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- validate-models-comment -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
